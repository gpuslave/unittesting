name: Fast Unit Tests

env:
  PYTHONPATH: .

on:
  push:
  pull_request:

jobs:
  test:
    name: Performance Test (with caching)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      
      - name: Update Package Index
        run: |
          sudo apt update -y

      - name: Setup Python 3.12
        id: cache
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: '$GITHUB_WORKSPACE/requirements.txt'

      - name: Echo Caching Results
        run: |
          echo "${{ steps.cache.outputs.cache-hit }}"

      - name: Configure Python Environment
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install -r $GITHUB_WORKSPACE/requirements.txt

      - name: Test R2
        run: |
          source venv/bin/activate
          PYTHONPATH=. python3 ./test/model_testing.py