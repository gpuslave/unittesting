name: Fast Unit Tests On Poetry

env:
  PYTHONPATH: .

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Performance Test (with caching)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      
      - name: Update Package Index
        run: |
          sudo apt update -y

      - name: Install poetry
        run: |
          pipx install poetry

      - name: Setup Python 3.12
        id: cache
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'poetry'

      - name: Echo Caching Results
        run: |
          echo "${{ steps.cache.outputs.cache-hit }}"

      - name: Configure Python Environment
        run: |
          poetry install

      - name: Test R2
        run: |
          poetry run python3 ./test/model_testing.py